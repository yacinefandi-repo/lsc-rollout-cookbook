<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Yacine Fandi">
<title>LSC Multi-Country Rollout Cookbook</title>
<meta name="description" content="A field manual for multi-country Agentforce Life Sciences (Life Sciences Cloud) for Customer Engagement rollouts and Veeva CRM migrations: phases, workshop questions, design rules and exit checklists.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Schibsted+Grotesk:wght@600;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout idea: a field manual. Left rail of chapters, a calm reading column, and one bold element:
   the rollout route map on the start page. Country codes appear as small stamped chips throughout. */
:root {
  color-scheme: light;
  --paper: #f1f3f5;
  --sheet: #ffffff;
  --ink: #0e1621;
  --ink-2: #3b4655;
  --ink-3: #677283;
  --rule: #d7dce2;
  --accent: #1f4fd1;
  --accent-ink: #ffffff;
  --accent-soft: #e8eefc;
  --hover: #eaedf1;
  --good: #11804a; --good-soft: #e3f3ea;
  --warn: #9a5a00; --warn-soft: #fcf0dc; --warn-line: #e3a23b;
  --bad: #b3261e; --bad-soft: #fbe6e4;
  --muted-soft: #eceef1;
  --font-display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0f1318; --sheet: #171c22; --ink: #eef1f4; --ink-2: #c3cad3; --ink-3: #8e98a5; --rule: #2c333c;
    --accent: #8ea8ff; --accent-ink: #0b1230; --accent-soft: #1d2747; --hover: #1f252d;
    --good: #5cc98c; --good-soft: #15291e; --warn: #f0b85a; --warn-soft: #2e2413; --warn-line: #a8721d;
    --bad: #f08c84; --bad-soft: #351b1a; --muted-soft: #222830;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0f1318; --sheet: #171c22; --ink: #eef1f4; --ink-2: #c3cad3; --ink-3: #8e98a5; --rule: #2c333c;
  --accent: #8ea8ff; --accent-ink: #0b1230; --accent-soft: #1d2747; --hover: #1f252d;
  --good: #5cc98c; --good-soft: #15291e; --warn: #f0b85a; --warn-soft: #2e2413; --warn-line: #a8721d;
  --bad: #f08c84; --bad-soft: #351b1a; --muted-soft: #222830;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 17px/1.55 var(--font-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
a { color: var(--accent); }
code { font-family: var(--font-mono); font-size: 0.85em; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 276px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: 0; height: 100vh; overflow-y: auto; border-right: 1px solid var(--rule); background: var(--sheet); padding: 22px 16px 28px; }
.rail .brand { display: block; text-decoration: none; color: var(--ink); padding: 0 8px 16px; border-bottom: 1px solid var(--rule); margin-bottom: 14px; }
.rail .brand b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 19px; line-height: 1.15; }
.rail .brand span { font-size: 13px; color: var(--ink-3); }
.rail h2 { font-family: var(--font-body); font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-3); margin: 16px 8px 6px; }
.rail ul { list-style: none; margin: 0; padding: 0; }
.rail a.nav { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 6px 8px; border-radius: 6px; color: var(--ink-2); text-decoration: none; font-size: 15px; line-height: 1.3; }
.rail a.nav:hover { background: var(--hover); color: var(--ink); }
.rail a.nav[aria-current="page"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.rail a.nav.planned { color: var(--ink-3); }
.rail .meta { font-size: 12px; color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.rail .meta.done { color: var(--good); font-weight: 700; }
.rail .menu-btn { display: none; }

main { min-width: 0; }
.page { max-width: 980px; margin: 0 auto; padding: 36px clamp(16px, 4vw, 48px) 64px; }
.kicker { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.page > header h1 { font-size: clamp(30px, 4.2vw, 44px); font-weight: 800; line-height: 1.08; margin: 6px 0 12px; }
.page > header .intro { font-size: 19px; color: var(--ink-2); max-width: 68ch; margin: 0; }
.page > header .phase-tag { display: inline-flex; gap: 8px; align-items: center; margin-top: 14px; font-size: 14px; color: var(--ink-3); }
section.block { margin-top: 40px; }
section.block > h2 { font-size: 24px; font-weight: 800; margin-bottom: 4px; }
section.block > .lead { color: var(--ink-2); margin: 4px 0 14px; max-width: 70ch; }
.block-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; padding: 6px 12px; font-size: 14px; font-weight: 600; cursor: pointer; line-height: 1.3; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.primary:hover { opacity: 0.9; background: var(--ink); }
.btn.small { padding: 4px 9px; font-size: 13px; }

/* ---------- start page: route map ---------- */
.hero { padding-bottom: 8px; }
.hero h1 { font-size: clamp(34px, 5.4vw, 60px); font-weight: 800; line-height: 1.02; max-width: 15ch; margin: 8px 0 16px; }
.hero p { font-size: 19px; color: var(--ink-2); max-width: 62ch; margin: 0 0 10px; }
.route { margin: 34px 0 6px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 22px 18px 18px; overflow-x: auto; }
.route-track { position: relative; display: grid; grid-template-columns: repeat(9, minmax(86px, 1fr)); min-width: 780px; }
.route-track::before { content: ""; position: absolute; left: 4%; right: 4%; top: 17px; height: 4px; border-radius: 2px; background: var(--accent); opacity: 0.35; }
.station { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; text-decoration: none; color: var(--ink); padding: 0 4px; }
.station .dot { width: 38px; height: 38px; border-radius: 50%; background: var(--sheet); border: 3px solid var(--rule); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 16px; z-index: 1; transition: transform 0.15s ease; }
.station.ready .dot { border-color: var(--accent); color: var(--accent); }
.station:hover .dot { transform: scale(1.08); }
.station .nm { font-family: var(--font-display); font-weight: 700; font-size: 14.5px; line-height: 1.2; }
.station .ct { font-size: 12px; color: var(--ink-3); }
.waves { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--rule); font-size: 14px; color: var(--ink-2); }
.stamp { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; letter-spacing: 0.06em; padding: 3px 8px; border: 1.5px solid currentColor; border-radius: 4px; color: var(--accent); transform: rotate(-2deg); background: var(--sheet); }
.stamp:nth-child(2n) { transform: rotate(1.5deg); }
.stamp.muted { color: var(--ink-3); }

.phase-list { display: grid; gap: 12px; margin-top: 14px; }
.phase { display: grid; grid-template-columns: 56px 1fr; gap: 16px; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 16px 18px; scroll-margin-top: 16px; }
.phase .num { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1; color: var(--accent); }
.phase h3 { font-size: 20px; font-weight: 800; }
.phase .goal { margin: 4px 0 10px; color: var(--ink-2); }
.phase .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 22px; }
.phase h4 { font-family: var(--font-body); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin: 4px 0 2px; }
.phase ul { margin: 0; padding-left: 18px; font-size: 15.5px; }
.phase .links { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
.phase .links a { font-size: 14px; font-weight: 600; text-decoration: none; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); }
.mc { display: grid; grid-template-columns: 22px 1fr; gap: 8px; margin-top: 10px; padding: 9px 12px; border-radius: 6px; background: var(--accent-soft); font-size: 15px; color: var(--ink); }
.mc svg { width: 18px; height: 18px; margin-top: 2px; color: var(--accent); }
.mc b { font-weight: 700; }
@media (max-width: 720px) { .phase .cols { grid-template-columns: 1fr; } .phase { grid-template-columns: 1fr; gap: 6px; } }

.howto { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-top: 16px; }
.howto div { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 12px 14px; font-size: 15px; color: var(--ink-2); }
.howto b { display: block; color: var(--ink); font-family: var(--font-display); font-size: 16px; margin-bottom: 2px; }

/* ---------- chapter blocks ---------- */
.model { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.model div { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 10px; font-size: 14px; max-width: 300px; }
.model b { display: block; font-family: var(--font-display); font-size: 14.5px; }
.model span { color: var(--ink-3); font-size: 13px; }

.ask { display: grid; gap: 10px; }
.q { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); }
.q summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 34px 1fr 20px; gap: 10px; align-items: start; padding: 14px 16px; }
.q summary::-webkit-details-marker { display: none; }
.q .qn { font-family: var(--font-display); font-weight: 800; color: var(--accent); font-size: 18px; font-variant-numeric: tabular-nums; }
.q .qt { font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1.3; }
.q .qw { display: block; font-family: var(--font-body); font-weight: 400; font-size: 15px; color: var(--ink-3); margin-top: 3px; }
.q .chev { width: 18px; height: 18px; margin-top: 4px; color: var(--ink-3); transition: transform 0.15s ease; }
.q[open] .chev { transform: rotate(180deg); }
.answers { padding: 0 16px 14px 60px; display: grid; gap: 8px; }
.ans { display: grid; grid-template-columns: minmax(170px, 0.8fr) 1.6fr; gap: 14px; padding: 10px 12px; border-radius: 6px; background: var(--paper); font-size: 15.5px; }
.ans .if { font-weight: 700; }
.ans .if::before { content: "If "; color: var(--ink-3); font-weight: 600; }
.ans .then { color: var(--ink-2); }
@media (max-width: 720px) { .answers { padding-left: 16px; } .ans { grid-template-columns: 1fr; gap: 4px; } }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 14px 16px; }
.card h3 { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
.card p { margin: 0; font-size: 15.5px; color: var(--ink-2); }

.decision { counter-reset: d; display: grid; gap: 10px; }
.decision .card { border-left: 4px solid var(--accent); }
.note { margin-top: 12px; padding: 10px 14px; border-radius: 6px; background: var(--warn-soft); border-left: 4px solid var(--warn-line); font-size: 15.5px; }

.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; display: grid; gap: 10px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 40px 1fr; gap: 12px; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 14px 16px; }
.steps li::before { content: counter(s); font-family: var(--font-display); font-weight: 800; font-size: 22px; color: var(--accent); line-height: 1.2; }
.steps h3 { font-size: 17px; font-weight: 700; }
.steps p { margin: 3px 0 0; font-size: 15.5px; color: var(--ink-2); }

.table-wrap { overflow-x: auto; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--rule); }
th { font-family: var(--font-display); font-size: 14px; font-weight: 700; background: var(--sheet); }
tr:last-child td { border-bottom: 0; }
td:first-child { font-weight: 600; }
.veeva td:first-child { font-weight: 400; color: var(--ink-2); }
.veeva td:nth-child(2) { font-weight: 600; }
.veeva .arrow { color: var(--ink-3); }

.watch { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.watch li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; background: var(--warn-soft); border-radius: 6px; padding: 10px 12px; font-size: 15.5px; }
.watch svg { width: 18px; height: 18px; color: var(--warn); margin-top: 3px; }
.tests { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.tests li { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 9px 12px; font-size: 15.5px; }

.done { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.done label { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; cursor: pointer; font-size: 15.5px; }
.done input { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--good); }
.done input:checked + span { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--good); }
.progress { font-size: 14px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

.planned-box { margin-top: 28px; background: var(--sheet); border: 1px dashed var(--ink-3); border-radius: 12px; padding: 20px 22px; }
.planned-box p { margin: 0 0 8px; color: var(--ink-2); }

/* ---------- deck kit and download buttons ---------- */
.btn.dl svg { width: 15px; height: 15px; flex: none; }
.btn.dl.primary svg { color: var(--paper); }
.btn:disabled { opacity: 0.6; cursor: progress; }
.deck-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.deckbar { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-top: 18px; padding: 10px 12px; border-radius: var(--radius); background: var(--sheet); border: 1px solid var(--rule); }
.deckbar-h { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); margin-right: 4px; }
.deckbar-h svg { width: 15px; height: 15px; }
.deckbar-sub { font-size: 13px; color: var(--ink-3); margin-left: 4px; }
.deckbar-more { font-size: 14px; font-weight: 600; margin-left: auto; }
.phase-decks { margin-top: 12px; }
.phase-decks h4 { margin-bottom: 6px; }
.kit-top { display: flex; flex-wrap: wrap; gap: 16px 32px; justify-content: space-between; align-items: start; }
.kit-steps { margin: 8px 0 0; padding-left: 20px; color: var(--ink-2); max-width: 64ch; }
.kit-steps li { margin: 4px 0; }
.kit-dl { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.decks { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; margin-top: 12px; }
.deck { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.deck-head { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.deck h3 { font-size: 17px; font-weight: 700; }
.deck-meta { margin: 2px 0 0; font-size: 13.5px; color: var(--ink-3); }
.deck p { margin: 0; font-size: 15px; color: var(--ink-2); }
.deck details summary { cursor: pointer; font-size: 14px; font-weight: 600; color: var(--accent); }
.deck ol { margin: 6px 0 0; padding-left: 20px; font-size: 14px; color: var(--ink-2); }
.deck-links { font-size: 13.5px !important; }

/* ---------- catalogue tool ---------- */
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 6px 0 14px; font-size: 14px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.cell { width: 34px; height: 30px; border-radius: 5px; border: 1px solid var(--rule); background: var(--sheet); font-family: var(--font-mono); font-weight: 600; font-size: 13px; cursor: pointer; display: inline-grid; place-items: center; padding: 0; }
.cell.S { background: var(--good-soft); color: var(--good); border-color: transparent; }
.cell.L { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.cell.G { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.cell.N { background: var(--muted-soft); color: var(--ink-3); border-color: transparent; }
.cell.legend-cell { cursor: default; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.toolbar input, .toolbar select { border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; padding: 5px 9px; font-size: 14px; }
.toolbar input { width: 70px; text-transform: uppercase; font-family: var(--font-mono); }
.cat { font-size: 14.5px; }
.cat th, .cat td { padding: 6px 8px; }
.cat thead th { position: sticky; top: 0; z-index: 2; }
.cat th.cc { text-align: center; min-width: 52px; }
.cat th.cc .wv { display: block; font-family: var(--font-body); font-weight: 400; font-size: 11.5px; color: var(--ink-3); }
.cat th.cc button { border: 0; background: none; color: var(--ink-3); cursor: pointer; font-size: 12px; padding: 0 2px; }
.cat td.c { text-align: center; }
.cat td.l1 { font-family: var(--font-display); font-weight: 700; white-space: nowrap; }
.cat td.l2 { color: var(--ink-3); white-space: nowrap; font-weight: 400; }
.cat td.l3 { font-weight: 400; min-width: 260px; }
.cat td.res { white-space: nowrap; font-size: 13px; font-weight: 700; }
.res.core { color: var(--good); } .res.local { color: var(--warn); } .res.gap { color: var(--bad); } .res.na { color: var(--ink-3); font-weight: 400; }
.cat tr.grp td { border-top: 2px solid var(--rule); }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 16px 0; }
.tile { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 12px 14px; }
.tile b { display: block; font-family: var(--font-display); font-size: 30px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile span { font-size: 14px; color: var(--ink-2); }
.country-fit { display: grid; gap: 6px; margin-top: 8px; }
.cf { display: grid; grid-template-columns: 54px 1fr 120px; gap: 10px; align-items: center; font-size: 14px; }
.bar { display: flex; height: 12px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--muted-soft); }
.bar i { display: block; height: 100%; }
.bar .S { background: var(--good); } .bar .L { background: var(--warn-line); } .bar .G { background: var(--bad); }
.example-note { font-size: 14px; color: var(--warn); font-weight: 600; }

/* ---------- footer, toast ---------- */
footer { border-top: 1px solid var(--rule); margin-top: 56px; padding-top: 18px; font-size: 13.5px; color: var(--ink-3); }
footer p { margin: 4px 0; max-width: 90ch; }
footer .byline { color: var(--ink-2); }
footer a { color: var(--accent); }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 6px; font-size: 14px; z-index: 50; }
.dialog-back { position: fixed; inset: 0; background: rgba(8, 12, 18, 0.5); display: grid; place-items: center; padding: 16px; z-index: 40; }
.dialog { background: var(--sheet); border-radius: 10px; width: min(680px, 100%); padding: 18px; }
.dialog textarea { width: 100%; min-height: 280px; font: 13px/1.5 var(--font-mono); border: 1px solid var(--rule); border-radius: 6px; padding: 8px; background: var(--paper); color: var(--ink); }

@media (max-width: 960px) {
  .shell { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--rule); padding: 12px 16px; }
  .rail nav { display: none; }
  .rail.open nav { display: block; }
  .rail .brand { border-bottom: 0; margin: 0; padding-bottom: 0; display: inline-block; }
  .rail-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .rail .menu-btn { display: inline-flex; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

</style>
</head>
<body>

  <aside class="rail">
    <div class="rail-top">
      <a class="brand" href="#start"><b>LSC Rollout Cookbook</b><span>Multi-country · Veeva to LSC</span></a>
      <button class="btn small menu-btn" data-act="menu" aria-expanded="false" aria-controls="nav">Chapters</button>
    </div>
    <nav id="nav" aria-label="Chapters"></nav>
  </aside>
  <main id="main"></main>

<script>
/* LSC Rollout Cookbook: content. Written for Agentforce Life Sciences (Life Sciences Cloud) for Customer Engagement.
   Sources: Salesforce Help (setup hub for Customer Engagement features), Trailhead, the Life Sciences developer guide,
   and field experience of multi-country pharma CRM programmes. Verify every setting against your release. */
window.COOKBOOK = {
  checked: "Checked against public Salesforce documentation, November 2026 (Winter '27 cycle)",
  /* Where the deck files live. Change this if you host the decks somewhere else (for example a GitHub release). */
  deckBase: "decks/",
  /* Same files packed as JSON (base64) for hosts that cannot serve .pptx directly, such as a Claude artifact. */
  deckData: "deck-data/",
  /* Anonymous page counts with GoatCounter (no cookies, no personal data).
     Only runs on the public site: set the GoatCounter site code to switch it on. */
  goatcounter: "lscworkbook",
  analyticsHost: "yacinefandi-repo.github.io",
  deckZip: "lsc-rollout-cookbook-decks.zip",

  phases: [
    { id: "p0", n: "0", name: "Mobilise", goal: "Agree why you are doing this, who decides, and how countries will be grouped into waves.",
      outputs: ["Programme goals ranked", "Governance model and design authority", "Funding and cost-allocation model", "Draft wave plan with a pilot country"],
      gate: ["Sponsor signs the goals", "Design authority named, with a decision rule for core versus local", "Pilot country committed (people, data, dates)"],
      mc: "This is where multi-country programmes are won or lost. Local budgets with no central mandate produce local orgs in all but name.",
      chapters: ["org-strategy"] },
    { id: "p1", n: "1", name: "Org and foundation", goal: "Choose the org model, set up a clean org and the build pipeline before anyone configures features.",
      outputs: ["Org model decision", "Licences, prerequisites and package installed", "Environment and release path (build, test, training, production)", "Naming and country-code standards"],
      gate: ["Package installed in a sandbox and production", "Pipeline deploys core metadata end to end", "Standards published and used from the first commit"],
      mc: "Every country inherits what you set here. Fixing naming or a territory backbone after wave 1 means migrating live data.",
      chapters: ["foundation", "country-model"] },
    { id: "p2", n: "2", name: "Global template design", goal: "Design one global template with the smallest set of agreed local variants.",
      outputs: ["Process catalogue rated per country", "Core and local decision per process", "Area designs (accounts, territories, products, visits, samples, consent, medical)", "Design decisions log"],
      gate: ["Every catalogue line has a decision", "Design review passed per area", "Gaps either accepted, scheduled or funded"],
      mc: "Run discovery with all wave-1 countries in the room, not one by one. Separate workshops guarantee divergence.",
      chapters: ["catalogue", "country-model", "accounts"] },
    { id: "p3", n: "3", name: "Core build", goal: "Build the global template once, in the build environment, under source control.",
      outputs: ["Core configuration and code in the repository", "Global reference data (products, specialties, picklists)", "Unit-tested core", "Base-language labels"],
      gate: ["Core passes system test", "No country-specific item inside core", "Mobile metadata cache generated for core profiles"],
      mc: "Core changes need the design authority's approval from this point on. Log every request against the catalogue line it serves.",
      chapters: [] },
    { id: "p4", n: "4", name: "Country localisation", goal: "Add each wave's approved local variants and translations on top of core.",
      outputs: ["Local fields, values and settings per country", "Translations per language", "Country territory structures and product alignment", "Country consent and compliance settings"],
      gate: ["Every local item traces to an approved variant", "Translations reviewed in the app by native speakers", "Country admin trained"],
      mc: "Countries that share a language must agree one translation. Settle it before the translators start.",
      chapters: ["country-model"] },
    { id: "p5", n: "5", name: "Data and content migration", goal: "Move each country's data and approved content with keys you can reconcile.",
      outputs: ["Load scripts per object with country-prefixed keys", "Mock loads and reconciliation reports", "Content repackaged and re-approved where needed", "Cut-over runbook"],
      gate: ["Two clean mock loads", "Reconciliation signed by the country", "Alignment jobs produce expected PATI counts"],
      mc: "Load country by country, never all countries in one run. One country's bad file must not block the others.",
      chapters: ["accounts"] },
    { id: "p6", n: "6", name: "Test", goal: "Prove core still works, then prove each country works as its users will use it.",
      outputs: ["Core regression suite", "Country UAT scripts by persona", "Visibility and offline tests", "Performance test from the customer network"],
      gate: ["No open critical defects", "Country UAT signed", "Users of one country cannot see another country's customers"],
      mc: "Test data visibility across countries explicitly. It is the defect that reaches an auditor.",
      chapters: [] },
    { id: "p7", n: "7", name: "Wave deployment", goal: "Go live one wave at a time with a rehearsed cut-over and hypercare.",
      outputs: ["Cut-over rehearsal", "Trained users and super users", "Hypercare rota", "Legacy freeze and decommission plan"],
      gate: ["Go/no-go per country", "Hypercare exit criteria met", "Lessons fed back before the next wave"],
      mc: "Keep a wave small enough to support. Two to four countries per wave is a common, manageable size.",
      chapters: [] },
    { id: "p8", n: "8", name: "Run", goal: "Keep core consistent while countries keep asking for change, three Salesforce releases a year.",
      outputs: ["Change classes (standard, minor, major)", "Release calendar aligned to Salesforce releases", "Core versus local change control", "Adoption measures"],
      gate: ["Release regression runs before each Salesforce release reaches production", "Local change requests reviewed for core reuse"],
      mc: "Every local request is a chance to grow core. Ask which other countries need it before building it locally.",
      chapters: [] }
  ],

  chapters: [
    /* ------------------------------------------------------------------ */
    {
      id: "org-strategy", group: "Programme", title: "Programme and org strategy", phase: "p0", status: "ready",
      kicker: "Phase 0 to 1",
      summary: "Goals, governance, funding, one org or several, and how to cut countries into waves.",
      intro: "A multi-country rollout is a governance project with a CRM inside it. Settle who decides and how far countries must standardise before you discuss a single field. Life Sciences Cloud for Customer Engagement starts in a new org, which gives you a rare chance to fix the org landscape you inherited.",
      sections: [
        { type: "ask", title: "Questions for the sponsor and country leads", items: [
          { q: "What does the company most want from this programme?", why: "Goals decide how hard you push standardisation. Rank them; everyone says all of them.",
            answers: [
              { a: "One way of working and global reporting", then: "Strong core, few local variants, a central design authority with veto rights. Budget for change management in every country." },
              { a: "Lower run cost and fewer systems", then: "Consolidate into as few orgs as the law allows and share integrations. Accept slower local change." },
              { a: "Speed for each country", then: "Thin core (data model, keys, integrations) and wide local freedom. Expect higher run cost and weaker global reporting." }
            ] },
          { q: "Who has the final say when two countries want different things?", why: "Without a named decider, every difference becomes a local variant.",
            answers: [
              { a: "A global design authority", then: "Central template; countries propose, the authority decides. Works when headquarters also funds the programme." },
              { a: "Regional leads", then: "Shared core plus regional templates. Plan a regional design authority and a global one above it for core items." },
              { a: "Each country", then: "You will get independent designs. Limit core to the data model, keys and integrations, and write that down." }
            ] },
          { q: "Where does the money come from, and how are costs shared?", why: "Whoever pays decides. Local budgets pull towards local designs.",
            answers: [
              { a: "Central budget", then: "Central template is realistic. Agree a cost-allocation key (users, complexity or revenue) for the run phase." },
              { a: "Country budgets", then: "Fund core centrally anyway, or it will never be built. Countries fund their own variants." }
            ] },
          { q: "Must any country's data stay in a particular region, or be separated from other affiliates?", why: "Data residency and legal separation are the strongest reasons for more than one org.",
            answers: [
              { a: "No residency or separation constraints", then: "Default to one global org with country separation through territories and sharing." },
              { a: "Regional residency (for example, EU data in the EU)", then: "Choose the org's hosting region accordingly, or split into regional orgs if regions conflict. Confirm with Salesforce and your privacy office." },
              { a: "One country needs an in-country solution (China is the usual example)", then: "Plan that country as a separate track from day one, with its own org and integrations." }
            ] },
          { q: "How many users, territories and countries will share the org at full scale?", why: "Platform limits apply per org. Big multi-country orgs reach them first.",
            answers: [
              { a: "Thousands of users and territories", then: "Check the territory limit early. LSC orgs start at 1,000 territories; Salesforce can raise it. Keep sharing rules and profiles lean." },
              { a: "A few hundred users", then: "One org is comfortable. Spend the saved effort on governance, not architecture." }
            ] },
          { q: "Which systems must every country connect to: one customer master and one data warehouse, or local ones?", why: "Shared integrations are the main financial argument for a strong core.",
            answers: [
              { a: "Shared global systems", then: "Put integration fields, keys and reference values in core. One mapping serves every country." },
              { a: "Local systems per country", then: "Standardise the CRM side (keys, objects, values) so each local interface maps to the same target." }
            ] },
          { q: "Which country goes first, and why?", why: "The pilot sets the template. A bad pilot choice bakes one country's quirks into core.",
            answers: [
              { a: "A representative, engaged mid-size country", then: "Good pilot. Its needs are typical, it has people to spare, and its success is persuasive." },
              { a: "The biggest or most complex country", then: "Risky. Its exceptions become core. Use it in wave 2 once the template has settled." },
              { a: "The country that shouts loudest", then: "Ask what it gives the programme in return: people, data and dates." }
            ] }
        ] },
        { type: "compare", title: "Org models", columns: ["One global org", "Shared core, regional orgs", "Independent orgs"],
          rows: [
            ["When it fits", "No residency conflicts; real central governance", "Residency or scale forces several orgs; core still matters", "Truly separate businesses or forced legal separation"],
            ["How countries are separated", "Territories, sharing and profiles", "Org per region, territories within", "Org per country or business"],
            ["Core consistency", "Built in: one configuration", "Same core deployed from one repository to every org", "None unless you enforce it by process"],
            ["Integration cost", "Lowest: one endpoint per system", "Medium: same mapping, several endpoints", "Highest: every org integrates separately"],
            ["Local change speed", "Slowest: shared release train", "Medium: regional releases", "Fastest"],
            ["Biggest risk", "Platform limits and a crowded release calendar", "Drift between orgs if the pipeline is bypassed", "Reinventing every solution; no global reporting"]
          ],
          note: "Most pharma companies land on one global org, with a separate track for a country whose law demands it. The shared-core model works today because core can live in source control and deploy to several orgs through one pipeline." },
        { type: "principles", title: "Cutting countries into waves", items: [
          { title: "Group by what the countries share", text: "Language, customer data provider, regulatory regime (sampling, consent) and sales model. Countries that share three of the four belong together." },
          { title: "Keep waves small", text: "Two to four countries per wave keeps hypercare manageable. The first wave after the pilot should be the smallest." },
          { title: "Leave a gap after the pilot", text: "Plan time to fold pilot lessons into core before wave 1 starts. Skipping it copies pilot defects everywhere." },
          { title: "Respect the calendar", text: "Avoid launches, congresses, year-end and each Salesforce release weekend. Field teams will not adopt a new system during a launch." },
          { title: "Retire legacy per wave", text: "Each wave's plan includes freezing and decommissioning the legacy system for those countries. Dual running is expensive and confuses reps." }
        ] },
        { type: "veeva", title: "Coming from Veeva CRM", items: [
          { from: "Several regional or country orgs, often with a parent org pushing configuration", to: "A fresh LSC org, usually one global org", note: "Do not recreate the old org split by default. Re-test the reasons for each separation." },
          { from: "Org-wide settings objects and messages", to: "Admin Console settings at org, profile and sometimes user level", note: "Country behaviour now follows the profile. See the country model chapter." },
          { from: "Years of local customisations", to: "A catalogue-driven core with approved variants", note: "Rate every local customisation against the process catalogue; most do not survive the question 'which process needs it?'" }
        ] },
        { type: "watch", title: "Watch out", items: [
          "Countries agreeing in workshops and diverging during build. Record each decision in the decision log with the country signatures.",
          "A design authority that cannot say no. Give it a written rule: core changes need a business case from at least two countries or a global mandate.",
          "Planning the technical cut-over but not the legacy contract end dates. Check notice periods for the old CRM and its data feeds.",
          "Choosing the pilot for politics rather than fit."
        ] },
        { type: "done", title: "Done when", items: [
          "Ranked programme goals signed by the sponsor",
          "Governance charter: design authority members, decision rule, escalation path",
          "Funding and cost-allocation model agreed",
          "Org model chosen, with data residency confirmed by the privacy office",
          "Wave plan with pilot, wave contents, dates and legacy retirement per wave"
        ] }
      ]
    },

    /* ------------------------------------------------------------------ */
    {
      id: "foundation", group: "Programme", title: "Foundation setup", phase: "p1", status: "ready",
      kicker: "Phase 1",
      summary: "Licences, prerequisites, package install, users, mobile and the Admin Console, in the order that works.",
      intro: "Install order matters. The managed package checks prerequisites at install time, and some settings cannot be turned off later without breaking upgrades. Do the foundation once, carefully, in a sandbox first, then repeat it in production from a written runbook.",
      sections: [
        { type: "steps", title: "Install sequence", items: [
          { title: "Get the licences onto a new, blank org", text: "Customer Engagement needs three things together: Agentforce Life Sciences, the Customer Engagement add-on licence and the Customer Engagement managed package.", mc: "Decide the org's hosting region before provisioning. Moving an org later is a project of its own." },
          { title: "Give the admins the right access", text: "Assign the Health Cloud Starter and Life Sciences Commercial Admin permission sets to the people who will set up the org, then turn on Life Sciences Customer Engagement in Setup." },
          { title: "Complete the pre-install prerequisites", text: "Set organization-wide defaults to Private for Account, Contract, Case and Opportunity. Enable Person Accounts. Build and activate the sales territory model with users assigned. Turn on Chatter, account plans, care plans and Surveys, and set the RSVP email address. Follow the current pre-install list in Salesforce Help; it changes with releases.", mc: "Build the territory backbone with country nodes now (see the country model chapter). Activating a model without them means rework later." },
          { title: "Turn on languages and the country model", text: "Enable the Translation Workbench and every language you will need across all waves, and turn on State and Country/Territory picklists so addresses use standard codes.", mc: "Enable all languages now, even for late waves. It costs nothing and avoids touching production settings later." },
          { title: "Install the managed package", text: "Install in a sandbox first. Skipped prerequisites make the install fail, and switching them off afterwards breaks future upgrades." },
          { title: "Run the post-install tasks", text: "Work through Salesforce's post-install list, then the user readiness steps: profiles, users, permission sets, person account and business account record types and layouts, tabs, apps and language settings." },
          { title: "Set up users with the least profiles you can", text: "Every field user gets Life Sciences Core plus a persona permission set (for example Field Sales Representative or Field Medical). Create profiles before users, and keep their number low.", mc: "Profiles are where country behaviour lives in the Admin Console. Design the profile matrix before creating any." },
          { title: "Set up the mobile app", text: "Configure the object metadata cache per profile, generate it, then set application and UI settings and translations. Page or layout changes reach the iPad only after a new cache is generated for the affected profiles." },
          { title: "Configure features in a deliberate order", text: "Start with customer data, integrations and consent. Then territories, call planning, visits and mobile. Then content and compliance, and only then advanced engagement and AI. AI recommendations built on unclean data are wasted effort." }
        ] },
        { type: "principles", title: "Environments and release path", items: [
          { title: "One build source", text: "Configure core in one build sandbox only. Every other environment receives changes from the pipeline, never by hand." },
          { title: "Name environments by purpose", text: "For example build, sit, uat, train, prod. Put the purpose in the sandbox name and the username suffix so nobody configures the wrong one." },
          { title: "A training environment per wave", text: "Training needs stable data. Refresh it before each wave's training, and reload the training data set after each refresh." },
          { title: "Raise limits before refreshing", text: "Limit increases (territories, API calls) agreed with Salesforce reach a sandbox only when it is created or refreshed. Ask early." },
          { title: "Align with Salesforce releases", text: "Salesforce ships three major releases a year, and sandboxes preview them first. Schedule a regression run in every preview window." }
        ] },
        { type: "watch", title: "Watch out", items: [
          "Users without a territory have limited access in the mobile app. Assign territories before the first mobile login.",
          "The mobile app does not support the System Administrator profile. Test with real persona users.",
          "Profile names feed the mobile metadata cache. Keep them to letters, digits, spaces, hyphens and underscores.",
          "Changing a profile's API name later means redoing its profile-based app settings."
        ] },
        { type: "done", title: "Done when", items: [
          "Package installed in a sandbox and production from the same runbook",
          "All languages for all waves enabled",
          "Territory model active with country nodes and users assigned",
          "Profile matrix designed and created; persona permission sets assigned",
          "Mobile metadata cache generated for every field profile and tested on a device"
        ] }
      ]
    },

    /* ------------------------------------------------------------------ */
    {
      id: "country-model", group: "Design", title: "The country model", phase: "p2", status: "ready",
      kicker: "Phase 1 to 4",
      summary: "Country codes, naming, picklists, profiles, visibility, translations and compliance variants for one org with many countries.",
      intro: "Design rules for running many countries in one org. Each rule exists because breaking it costs the most in wave 3, when the org is live in several countries and every change touches production data.",
      sections: [
        { type: "principles", title: "Country codes are the backbone", items: [
          { title: "Use ISO 3166-1 alpha-2 codes everywhere", text: "Use FR, DE, ES and so on. Never mix country names, internal codes and ISO codes. Pick a code for multi-country affiliates too (for example a cluster code) and document it." },
          { title: "Put a country node at the top of each territory branch", text: "Global > region > country > districts > territories, with the country code at the start of every territory API name (FR_..., DE_...). Territory names then stay unique and readable in reports, alignment files and loads." },
          { title: "Prefix external IDs with the country and source", text: "For example FR-ONEKEY-12345. Keys collide between countries surprisingly often, and a prefixed key also tells support where a record came from." },
          { title: "Record each user's countries", text: "LSC limits account search to the countries on the user's User Additional Info (available and preferred country, as ISO codes). Fill it for every user as part of user provisioning." },
          { title: "Stamp a country on records that territories do not cover", text: "Objects outside territory sharing need a country field filled from the user or the account, so criteria-based sharing, reports and country-only data fixes work." }
        ] },
        { type: "principles", title: "Naming and documentation", items: [
          { title: "Never put a country in an API name", text: "A field built for one country is often wanted by a second one a year later, and API names cannot change once integrations use them. Put countries in the description, not the name." },
          { title: "Mark core versus local", text: "Use one company prefix for core items and a different marker for local ones, so a schema export sorts itself. Anyone changing a core item sees at once that it needs design authority approval." },
          { title: "Write a structured description on every custom item", text: "First line: the ISO codes of the countries using it, or GBL for global. Then the purpose, the requirement ID, and any integration or report that depends on it." },
          { title: "Name profiles and layouts by persona, not country", text: "For example Field Sales, Field Medical, KAM. Add a country or cluster code only where a profile exists purely to carry country-specific settings." }
        ] },
        { type: "decision", title: "Picklists across countries", lead: "Different countries want different values in the same picklist. Choose per field, in this order:",
          items: [
            { title: "1. Harmonise the values", text: "One list in English with translated labels. Best for reporting and integration. Works for most fields once countries see the full list." },
            { title: "2. A local field for a local need", text: "If only one or two countries use a field, give it its own field and show it with field-level security. Do not create record types for it." },
            { title: "3. Record types per country", text: "Only on objects with a single purpose where values truly differ by country (time off reasons are the classic case). Each country record type adds profile and layout maintenance." },
            { title: "4. A reference object", text: "For very long or provider-delivered lists (specialty codes, for example). A picklist tops out around 1,000 values; a lookup to a reference object does not, and data loads can maintain it." }
          ],
          note: "Load data with the base (English) picklist values. Loading translated values creates junk values on unrestricted picklists and errors on restricted ones. Translate in the transformation, not in Salesforce." },
        { type: "principles", title: "Profiles and the Admin Console", items: [
          { title: "The profile carries country behaviour", text: "Many LSC settings are hierarchical: org default, then profile, and for some (visit and email settings, for example) user. If two countries need different behaviour, they need different profiles or user-level settings." },
          { title: "Design a profile matrix, not a profile list", text: "Rows are personas, columns are behaviour clusters (groups of countries that share settings), not individual countries. Fewer clusters means fewer profiles, caches and translations to maintain." },
          { title: "Profile settings beat the org default and cannot be deleted in the UI", text: "Once a profile-level configuration exists, it overrides the org default for that profile. To realign it, edit it to match. Track which profiles have overrides." },
          { title: "Each profile has a cost", text: "Every profile needs field-level security for every new field, a mobile metadata cache assignment and testing. Count that before agreeing a new one." }
        ] },
        { type: "principles", title: "Visibility between countries", items: [
          { title: "Separate countries with the territory hierarchy", text: "Reps see the accounts aligned to their territories. Country admins sit at the country node; head-office users get read access through sharing on purpose, not by accident." },
          { title: "Account alignment does not inherit downwards", text: "Aligning an account to a country node does not give it to the territories below. Align to the territories where reps work." },
          { title: "Products and content do inherit", text: "Products aligned to a parent territory flow down to its children unless a child excludes them, and presentations can be distributed to a parent and all current and future children. Align country products and content at the country node." },
          { title: "App alerts do not inherit", text: "An alert reaches a user only if their active territory matches an alert territory record exactly. Country-wide announcements need one record per territory, so script it." },
          { title: "Test isolation explicitly", text: "Include a test where a user of one country searches for a customer of another. It should fail unless you meant it to succeed." }
        ] },
        { type: "principles", title: "Language and translation", items: [
          { title: "English as build and base language", text: "Build, document and support in English, even for a single non-English country. Users see their language through translations." },
          { title: "Keep a translation dictionary", text: "List every label, value and message with a flag: translate or not, and per which language. Export untranslated items, translate only what the dictionary says, import, repeat each release." },
          { title: "One translation per language, not per country", text: "France, Belgium and Switzerland share one French. Agree terms before the translators start, and review them in the app, on the iPad, by native-speaking users." },
          { title: "Know what does not translate", text: "Some items cannot be translated (report folder and list view names, for example). Create language-specific folders and views and share them by country." },
          { title: "Check label lengths", text: "Translations are often longer than English and get cut off in layouts and on the iPad. Check field labels and section names on a device." },
          { title: "Translate the mobile and AI pieces too", text: "Mobile app translations and custom labels used by components (for example the Agentforce welcome utterances) are separate from field labels." }
        ] },
        { type: "principles", title: "Compliance differs by country", items: [
          { title: "Consent", text: "Opt-in rules, double opt-in and channel rules differ by country. Communication subscriptions can be filtered by territory and audience, so country rules can live at the country node." },
          { title: "Sampling", text: "Some countries do not allow product samples or restrict them heavily. Keep sampling configuration and permissions off profiles of countries that do not sample." },
          { title: "Licence checks", text: "LSC's licence validation (state licence, distributor licence, DEA) follows US rules. Other countries need their own design or none." },
          { title: "Transparency reporting", text: "Transfers of value are reported differently (EFPIA disclosure in Europe, Sunshine Act in the US). If you capture visit expenses, decide per country what feeds the disclosure process." },
          { title: "Medical and commercial separation", text: "Many countries require strict separation between sales and medical activity. Design profiles and sharing so commercial users cannot see medical inquiries or insights." }
        ] },
        { type: "veeva", title: "Coming from Veeva CRM", items: [
          { from: "Country-specific settings in Veeva settings and messages, often per profile", to: "Admin Console settings at org default, profile and user level", note: "Same idea, new place. Rebuild the profile matrix from the behaviour each country actually needs." },
          { from: "Country flags on users and records for sharing and reports", to: "User Additional Info countries, territory hierarchy with country nodes, and a country field where needed", note: "Search scope by country is standard in LSC; do not rebuild it with custom code." },
          { from: "Products copied per country (Brand (FR), Brand (DE)) to control visibility", to: "One product record aligned to country territories", note: "Territory product alignment with inheritance replaces product copies. Merge the copies during migration." },
          { from: "Translation through workbench export, offline messages and per-language records", to: "Workbench, custom labels and mobile translations", note: "Keep the iterative export-translate-import cycle; it still beats manual entry for many languages." }
        ] },
        { type: "watch", title: "Watch out", items: [
          "A country code in a field API name. It will be wrong the day a second country uses the field.",
          "One profile per country 'to be safe'. Twenty countries times five personas is a hundred profiles, each needing field-level security and caches.",
          "Translations entered directly in production. Translate in the build environment and deploy, or the next deployment overwrites them.",
          "Picklist values loaded in the local language. They look right in one country and break every global report."
        ] },
        { type: "done", title: "Done when", items: [
          "Country code standard published, with cluster codes for multi-country affiliates",
          "Territory backbone built with country nodes and prefixed names",
          "Naming and description standard in use for every custom item",
          "Picklist decision recorded for every field with country differences",
          "Profile matrix (personas by behaviour cluster) approved",
          "Translation dictionary and process in place, with reviewers named per language",
          "Country compliance variants listed for consent, sampling, licences, transparency and medical separation"
        ] }
      ]
    },

    /* ------------------------------------------------------------------ */
    {
      id: "accounts", group: "Areas", title: "Accounts and customer data", phase: "p2", status: "ready",
      kicker: "Area chapter",
      summary: "HCPs, HCOs, credentials, addresses, affiliations, data change requests and search, with every question to ask per country.",
      intro: "Almost everything in Customer Engagement depends on clean customer data. Territory alignment, sampling checks, consent and AI summaries all fail quietly on bad accounts. In a multi-country programme, the hard part is that countries manage customer data in different ways, and the design must carry all of them.",
      model: [
        { obj: "Account", note: "HCP as person account, HCO as business account" },
        { obj: "Healthcare Provider", note: "What the provider is: type, class, status; one primary per account" },
        { obj: "Healthcare Provider Specialty", note: "Links the provider to a Care Specialty" },

              { a: "Per product", then: "Use a Data Use Purpose linked to the marketable product on the subscription. The channel says how, the purpose says which product." }
