</script>
<script>
(function () {
  "use strict";
  var C = window.COOKBOOK;
  var K = "lscck:v1:";
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(K + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(K + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
  };
  var ICON = {
    globe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>',
    warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17h.01"/></svg>',
    dl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 19h16"/></svg>',
    chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>'
  };
  function h(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function $(s) { return document.querySelector(s); }
  function chapter(id) { return C.chapters.filter(function (c) { return c.id === id; })[0]; }
  function phase(id) { return C.phases.filter(function (p) { return p.id === id; })[0]; }
  function readyChapter(c) { return c.status === "ready" || c.status === "tool" || c.status === "decks"; }

  /* ---------- decks ---------- */
  var DECKS = C.decks || [];
  var EXTRA_PHASES = { steerco: ["p0", "p8"], hypercare: ["p7", "p8"] };
  function deckPhases(d) { return EXTRA_PHASES[d.id] || [d.phase]; }
  function decksForPhase(pid) { return DECKS.filter(function (d) { return deckPhases(d).indexOf(pid) >= 0; }); }
  function decksForChapter(cid) { return DECKS.filter(function (d) { return (d.chapters || []).indexOf(cid) >= 0; }); }
  function shortName(d) { return d.kind === "discovery" ? d.title.replace("Discovery workshop: ", "") : d.title; }
  function dlBtn(d, label, cls) {
    return '<button class="btn small dl ' + (cls || "") + '" data-act="dl" data-file="' + h(d.file) + '" title="Download ' + h(d.title) + ' (PowerPoint)">' + ICON.dl + "<span>" + h(label || d.title) + "</span></button>";
  }
  function zipBtn(label) { return '<button class="btn dl primary" data-act="dl" data-file="' + h(C.deckZip) + '">' + ICON.dl + "<span>" + h(label || "Download all decks (.zip)") + "</span></button>"; }
  function deckBar(list, heading) {
    if (!list.length) return "";
    var disc = list.filter(function (d) { return d.kind === "discovery"; }), other = list.filter(function (d) { return d.kind !== "discovery"; });
    return '<div class="deckbar"><span class="deckbar-h">' + ICON.dl + h(heading || "Decks for this chapter") + "</span>" +
      other.map(function (d) { return dlBtn(d); }).join("") +
      (disc.length > 1 ? '<span class="deckbar-sub">Discovery workshops:</span>' + disc.map(function (d) { return dlBtn(d, shortName(d)); }).join("") : disc.map(function (d) { return dlBtn(d); }).join("")) +
      '<a class="deckbar-more" href="#decks">All decks</a></div>';
  }
  var dlNs = null;
  function downloadsNs() {
    if (!dlNs) dlNs = (window.claude && typeof window.claude.use === "function") ? window.claude.use("downloads").then(function (x) { return x; }, function () { return null; }) : Promise.resolve(null);
    return dlNs;
  }
  function linkDownload(url, file) {
    var a = document.createElement("a"); a.href = url; a.download = file; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
  }
  function fetchDeck(file) {
    return fetch((C.deckData || "deck-data/") + file + ".json").then(function (r) {
      if (!r.ok) throw { code: "missing" };
      return r.json();
    }).then(function (j) {
      var bin = atob(j.b64), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new Blob([bytes], { type: j.type || "application/octet-stream" });
    });
  }
  function downloadFile(file, btn) {
    track({ path: "download/" + file, title: "Download: " + file, event: true });
    if (btn) btn.disabled = true;
    var done = function () { if (btn) btn.disabled = false; };
    downloadsNs().then(function (dl) {
      if (dl) {
        return fetchDeck(file).then(function (b) { return dl.save({ filename: file, data: b }); })
          .then(function () { toast(file + " saved."); done(); }, function (err) {
            done();
            var code = err && err.code;
            if (code === "declined") return;
            if (code === "rate_limited") { toast("A download is already waiting for your confirmation."); return; }
            toast("Download is not available in this view. Open the page on claude.ai and try again.");
          });
      }
      /* Outside Claude (self-hosted): use the packed data if present, else a plain link to the .pptx. */
      return fetchDeck(file).then(function (b) {
        var u = URL.createObjectURL(b); linkDownload(u, file); setTimeout(function () { URL.revokeObjectURL(u); }, 4000); done();
      }, function () { linkDownload((C.deckBase || "decks/") + file, file); done(); });
    });
  }


  /* ---------- checklist progress ---------- */
  function checks() { return store.get("checks", {}); }
  function doneItems(c) {
    var s = (c.sections || []).filter(function (x) { return x.type === "done"; })[0];
    return s ? s.items : [];
  }
  function progress(c) {
    var items = doneItems(c), ck = checks()[c.id] || {};
    var n = items.filter(function (_, i) { return ck[i]; }).length;
    return { n: n, total: items.length };
  }

  /* ---------- navigation ---------- */
  function renderNav(active) {
    var groups = ["Programme", "Design", "Areas", "Tools"];
    var html = '<h2>Start</h2><ul><li><a class="nav" href="#start"' + (active === "start" ? ' aria-current="page"' : "") + '><span>The rollout route</span><span class="meta">9 phases</span></a></li></ul>';
    groups.forEach(function (g) {
      var items = C.chapters.filter(function (c) { return c.group === g; });
      if (!items.length) return;
      html += "<h2>" + g + "</h2><ul>" + items.map(function (c) {
        var meta = "";
        if (c.status === "planned") meta = '<span class="meta">next</span>';
        else if (c.status === "tool") meta = '<span class="meta">tool</span>';
        else if (c.status === "decks") meta = '<span class="meta">' + DECKS.length + "</span>";
        else { var p = progress(c); meta = '<span class="meta' + (p.n === p.total && p.total ? " done" : "") + '">' + p.n + "/" + p.total + "</span>"; }
        return '<li><a class="nav' + (c.status === "planned" ? " planned" : "") + '" href="#' + c.id + '"' + (active === c.id ? ' aria-current="page"' : "") + "><span>" + h(c.title) + "</span>" + meta + "</a></li>";
      }).join("") + "</ul>";
    });
    $("#nav").innerHTML = html;
  }

  function phaseDecks(p) {
    var list = decksForPhase(p.id);
    if (!list.length) return "";
    var disc = list.filter(function (d) { return d.kind === "discovery"; }), other = list.filter(function (d) { return d.kind !== "discovery"; });
    return '<div class="phase-decks"><h4>Decks</h4><div class="deck-row">' + other.map(function (d) { return dlBtn(d); }).join("") +
      (disc.length ? '<span class="deckbar-sub">Discovery:</span>' + disc.map(function (d) { return dlBtn(d, shortName(d)); }).join("") : "") + "</div></div>";
  }

  /* ---------- start page ---------- */
  function renderStart() {
    var lastReady = -1;
    C.phases.forEach(function (p, i) { if (p.chapters.some(function (id) { var c = chapter(id); return c && readyChapter(c); })) lastReady = i; });
    var pct = lastReady < 0 ? 0 : Math.round((lastReady + 0.5) / C.phases.length * 100);
    var stations = C.phases.map(function (p) {
      var ready = p.chapters.some(function (id) { var c = chapter(id); return c && readyChapter(c); });
      return '<a class="station' + (ready ? " ready" : "") + '" href="#start" data-phase="' + p.id + '"><span class="dot">' + p.n + '</span><span class="nm">' + h(p.name) + '</span><span class="ct">' + (ready ? p.chapters.length + " chapter" + (p.chapters.length > 1 ? "s" : "") : "coming") + "</span></a>";
    }).join("");
    var phases = C.phases.map(function (p) {
      var links = p.chapters.map(function (id) { var c = chapter(id); return c ? '<a href="#' + c.id + '">' + h(c.title) + "</a>" : ""; }).join("");
      return '<article class="phase" id="phase-' + p.id + '"><div class="num">' + p.n + "</div><div>" +
        "<h3>" + h(p.name) + '</h3><p class="goal">' + h(p.goal) + "</p>" +
        '<div class="cols"><div><h4>Outputs</h4><ul>' + p.outputs.map(function (x) { return "<li>" + h(x) + "</li>"; }).join("") + "</ul></div>" +
        "<div><h4>Gate to move on</h4><ul>" + p.gate.map(function (x) { return "<li>" + h(x) + "</li>"; }).join("") + "</ul></div></div>" +
        '<div class="mc">' + ICON.globe + "<div><b>Multi-country:</b> " + h(p.mc) + "</div></div>" +
        (links ? '<div class="links">' + links + "</div>" : "") + phaseDecks(p) + "</div></article>";
    }).join("");
    return '<div class="page"><header class="hero"><span class="kicker">Agentforce Life Sciences for Customer Engagement</span>' +
      "<h1>Roll out Life Sciences Cloud, country by country.</h1>" +
      "<p>A field manual for consultants and internal programme leads running a multi-country implementation or a move from Veeva CRM. Each chapter tells you what to ask, what every answer means for the build, what changes coming from Veeva, and when you are done.</p></header>" +
      '<div class="route" aria-label="Rollout phases"><div class="route-track" style="--pct:' + pct + '%">' + stations + "</div>" +
      '<div class="waves"><span>A typical wave plan:</span><span class="stamp">PILOT · 1 country</span><span class="stamp">WAVE 1 · 2–3</span><span class="stamp">WAVE 2 · 3–4</span><span class="stamp muted">WAVE n · …</span><span>Phases 4 to 7 repeat for every wave.</span></div></div>' +
      '<div class="howto"><div><b>Ask</b>Workshop questions, each with the answers you will hear and what they mean for the build.</div>' +
      "<div><b>Coming from Veeva</b>What each familiar object or habit becomes in Life Sciences Cloud.</div>" +
      "<div><b>Multi-country</b>Blue notes: where countries diverge and how to keep one core.</div>" +
      "<div><b>Done when</b>Exit checklists you can tick. Progress stays in this browser.</div>" +
      '<div><b>Deck kit</b>' + DECKS.length + ' editable PowerPoint templates, one per gate. <a href="#decks">Browse the kit</a>.</div></div>' +
      '<section class="block"><h2>The nine phases</h2><p class="lead">Phases 0 to 3 happen once. Phases 4 to 7 repeat for each wave of countries, and phase 8 never ends.</p><div class="phase-list">' + phases + "</div></section>" +
      footer() + "</div>";
  }

  /* ---------- chapter blocks ---------- */
  function mcNote(text) { return '<div class="mc">' + ICON.globe + "<div><b>Multi-country:</b> " + h(text) + "</div></div>"; }

  var BLOCKS = {
    ask: function (s, c) {
      return '<section class="block"><div class="block-head"><div><h2>' + h(s.title) + '</h2><p class="lead">Open a question to see the answers you are likely to hear and what each one means.</p></div>' +
        '<div class="deck-row">' + decksForChapter(c.id).filter(function (d) { return d.kind === "discovery"; }).map(function (d) { return dlBtn(d, "Workshop deck", "primary"); }).join("") +
        '<button class="btn" data-act="copy-questions" data-ch="' + c.id + '">Copy questions</button></div></div><div class="ask">' +
        s.items.map(function (q, i) {
          return '<details class="q"' + (i === 0 ? " open" : "") + '><summary><span class="qn">' + String(i + 1).padStart(2, "0") + '</span><span class="qt">' + h(q.q) + '<span class="qw">' + h(q.why) + "</span></span>" + ICON.chev + "</summary>" +
            '<div class="answers">' + q.answers.map(function (a) { return '<div class="ans"><span class="if">' + h(a.a) + '</span><span class="then">' + h(a.then) + "</span></div>"; }).join("") + "</div></details>";
        }).join("") + "</div></section>";
    },
    compare: function (s) {
      return '<section class="block"><h2>' + h(s.title) + '</h2><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th></th>' + s.columns.map(function (x) { return "<th>" + h(x) + "</th>"; }).join("") + "</tr></thead><tbody>" +
        s.rows.map(function (r) { return "<tr>" + r.map(function (x) { return "<td>" + h(x) + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table></div>" +
        (s.note ? mcNote(s.note) : "") + "</section>";
    },
    principles: function (s) {
      return '<section class="block"><h2>' + h(s.title) + '</h2><div class="cards" style="margin-top:12px">' +
        s.items.map(function (p) { return '<div class="card"><h3>' + h(p.title) + "</h3><p>" + h(p.text) + "</p></div>"; }).join("") + "</div></section>";
    },
    decision: function (s) {
      return '<section class="block"><h2>' + h(s.title) + '</h2><p class="lead">' + h(s.lead) + '</p><div class="decision">' +
        s.items.map(function (p) { return '<div class="card"><h3>' + h(p.title) + "</h3><p>" + h(p.text) + "</p></div>"; }).join("") + "</div>" +
        (s.note ? '<div class="note">' + h(s.note) + "</div>" : "") + "</section>";
    },
    steps: function (s) {
      return '<section class="block"><h2>' + h(s.title) + '</h2><ol class="steps" style="margin-top:12px">' +
        s.items.map(function (p) { return "<li><div><h3>" + h(p.title) + "</h3><p>" + h(p.text) + "</p>" + (p.mc ? mcNote(p.mc) : "") + "</div></li>"; }).join("") + "</ol></section>";
    },
    veeva: function (s) {
      return '<section class="block"><h2>' + h(s.title) + '</h2><div class="table-wrap veeva" style="margin-top:12px"><table><thead><tr><th>In Veeva CRM</th><th>In Life Sciences Cloud</th><th>What to do</th></tr></thead><tbody>' +
        s.items.map(function (r) { return "<tr><td>" + h(r.from) + "</td><td>" + h(r.to) + "</td><td>" + h(r.note) + "</td></tr>"; }).join("") + "</tbody></table></div></section>";
    },
    watch: function (s) {
      return '<section class="block"><h2>' + h(s.title) + '</h2><ul class="watch" style="margin-top:12px">' + s.items.map(function (x) { return "<li>" + ICON.warn + "<span>" + h(x) + "</span></li>"; }).join("") + "</ul></section>";
    },
    mclist: function (s) {
      return '<section class="block"><h2>' + h(s.title) + '</h2><div style="display:grid;gap:8px;margin-top:12px">' + s.items.map(function (x) { return '<div class="mc" style="margin-top:0">' + ICON.globe + "<div>" + h(x) + "</div></div>"; }).join("") + "</div></section>";
    },
    test: function (s) {
      return '<section class="block"><h2>' + h(s.title) + '</h2><ul class="tests" style="margin-top:12px">' + s.items.map(function (x) { return "<li>" + h(x) + "</li>"; }).join("") + "</ul></section>";
    },
    done: function (s, c) {
      var ck = checks()[c.id] || {}, p = progress(c);
      return '<section class="block"><div class="block-head"><h2>' + h(s.title) + '</h2><span class="progress" id="prog-' + c.id + '">' + p.n + " of " + p.total + ' done</span></div><ul class="done">' +
        s.items.map(function (x, i) { return '<li><label><input type="checkbox" id="ck-' + c.id + "-" + i + '" data-ch="' + c.id + '" data-i="' + i + '"' + (ck[i] ? " checked" : "") + "><span>" + h(x) + "</span></label></li>"; }).join("") + "</ul></section>";
    }
  };

  function renderChapter(c) {
    var p = phase(c.phase);
    var head = '<header><span class="kicker">' + h(c.kicker) + "</span><h1>" + h(c.title) + "</h1>" +
      (c.intro ? '<p class="intro">' + h(c.intro) + "</p>" : '<p class="intro">' + h(c.summary) + "</p>") +
      (p ? '<div class="phase-tag">Mainly used in <a href="#start" data-phase="' + p.id + '">phase ' + p.n + ": " + h(p.name) + "</a></div>" : "") + "</header>";
    if (c.status === "decks") return '<div class="page">' + head + renderDeckKit() + footer() + "</div>";
    if (c.status === "tool") return '<div class="page">' + head + deckBar(decksForChapter(c.id), "Decks for the workshop") + renderCatalogue() + footer() + "</div>";
    if (c.status === "planned") {
      return '<div class="page">' + head + '<div class="planned-box"><p><b>This chapter is next in line.</b> It will follow the same pattern: questions to ask, what each answer means, what changes coming from Veeva, multi-country notes, watch-outs and an exit checklist.</p>' +
        '<p>Until then, the <a href="#country-model">country model</a> and the <a href="#catalogue">process catalogue</a> cover the cross-cutting decisions for this area.</p></div>' + footer() + "</div>";
    }
    var model = c.model ? '<div class="model" aria-label="Key objects">' + c.model.map(function (m) { return "<div><b>" + h(m.obj) + "</b><span>" + h(m.note) + "</span></div>"; }).join("") + "</div>" : "";
    return '<div class="page">' + head + deckBar(decksForChapter(c.id)) + model + c.sections.map(function (s) { return BLOCKS[s.type] ? BLOCKS[s.type](s, c) : ""; }).join("") + footer() + "</div>";
  }

  /* ---------- deck kit ---------- */
  function renderDeckKit() {
    var html = '<section class="block"><div class="kit-top"><div><h2>How to use the kit</h2><ol class="kit-steps">' +
      "<li>Download a deck, or the whole kit.</li><li>Apply your company theme from PowerPoint's Design tab. Colours and fonts follow the theme.</li>" +
      "<li>Replace everything in [brackets]. Speaker notes on each slide say how to use it.</li><li>For discovery workshops, rate processes live with the <a href=\"#catalogue\">process catalogue tool</a> and paste the result.</li></ol></div>" +
      '<div class="kit-dl">' + zipBtn() + '<span class="progress">' + DECKS.length + " decks · " + DECKS.reduce(function (n, d) { return n + d.slides.length; }, 0) + " slides</span></div></div></section>";
    C.phases.forEach(function (p) {
      var list = DECKS.filter(function (d) { return d.phase === p.id; });
      if (!list.length) return;
      html += '<section class="block"><h2>Phase ' + p.n + ": " + h(p.name) + '</h2><div class="decks">' + list.map(function (d) {
        return '<article class="deck"><div class="deck-head"><div><h3>' + h(d.title) + '</h3><p class="deck-meta">' + h(d.when) + " · " + h(d.audience) + "</p></div>" + dlBtn(d, "Download", "primary") + "</div>" +
          "<p>" + h(d.purpose) + "</p>" +
          '<details><summary>' + d.slides.length + " slides</summary><ol>" + d.slides.map(function (t) { return "<li>" + h(t) + "</li>"; }).join("") + "</ol></details>" +
          ((d.chapters || []).length ? '<p class="deck-links">Used with: ' + d.chapters.map(function (id) { var ch = chapter(id); return ch ? '<a href="#' + ch.id + '">' + h(ch.title) + "</a>" : ""; }).join(" · ") + "</p>" : "") +
          "</article>";
      }).join("") + "</div></section>";
    });
    return html;
  }

  /* ---------- process catalogue ---------- */
  function catState() {
    var s = store.get("catalogue", null);
    if (!s) s = exampleState();
    return s;
  }
  function exampleState() {
    var ex = C.catalogue.example, r = {};
    C.catalogue.processes.forEach(function (_, i) { r[i] = {}; ex.countries.forEach(function (c, j) { r[i][c.code] = ex.ratings[i] ? ex.ratings[i][j] : ""; }); });
    return { example: true, countries: ex.countries.slice(), ratings: r };
  }
  function classify(row, countries) {
    var vals = countries.map(function (c) { return row[c.code] || ""; });
    var rated = vals.filter(function (v) { return v; });
    if (!rated.length) return { cls: "na", label: "Not rated" };
    var need = vals.filter(function (v) { return v === "S" || v === "L" || v === "G"; });
    if (!need.length) return { cls: "na", label: "Out of scope" };
    if (vals.indexOf("G") >= 0) return { cls: "gap", label: "Gap in " + vals.filter(function (v) { return v === "G"; }).length };
    if (vals.indexOf("L") >= 0) return { cls: "local", label: "Core + " + vals.filter(function (v) { return v === "L"; }).length + " variant" + (vals.filter(function (v) { return v === "L"; }).length > 1 ? "s" : "") };
    return { cls: "core", label: "Core" + (need.length < countries.length ? " (" + need.length + "/" + countries.length + ")" : "") };
  }
  function renderCatalogue() {
    var st = catState(), P = C.catalogue.processes, cs = st.countries;
    var counts = { core: 0, local: 0, gap: 0, na: 0 };
    var rows = P.map(function (p, i) {
      var cl = classify(st.ratings[i] || {}, cs); counts[cl.cls]++;
      var first = i === 0 || P[i - 1][0] !== p[0];
      return '<tr class="' + (first ? "grp" : "") + '"><td class="l1">' + (first ? h(p[0]) : "") + '</td><td class="l2">' + h(p[1]) + '</td><td class="l3">' + h(p[2]) + "</td>" +
        cs.map(function (c) {
          var v = (st.ratings[i] || {})[c.code] || "";
          var lab = C.catalogue.scale.filter(function (x) { return x.code === v; })[0].label;
          return '<td class="c"><button class="cell ' + v + '" data-act="rate" data-i="' + i + '" data-c="' + h(c.code) + '" aria-label="' + h(p[2]) + ", " + h(c.code) + ": " + lab + '" title="' + lab + ' (click to change)">' + (v || "·") + "</button></td>";
        }).join("") + '<td class="res ' + cl.cls + '">' + h(cl.label) + "</td></tr>";
    }).join("");
    var fit = cs.map(function (c) {
      var t = { S: 0, L: 0, G: 0, N: 0, "": 0 };
      P.forEach(function (_, i) { t[(st.ratings[i] || {})[c.code] || ""]++; });
      var need = t.S + t.L + t.G;
      var pct = need ? Math.round(t.S / need * 100) : 0;
      return '<div class="cf"><span class="stamp">' + h(c.code) + '</span><div class="bar" role="img" aria-label="' + h(c.code) + ": " + t.S + " standard, " + t.L + " local, " + t.G + ' gaps">' +
        (need ? '<i class="S" style="flex:' + t.S + '"></i><i class="L" style="flex:' + t.L + '"></i><i class="G" style="flex:' + t.G + '"></i>' : "") + "</div><span>" + (need ? pct + "% standard" : "not rated") + (t[""] ? " · " + t[""] + " open" : "") + "</span></div>";
    }).join("");
    var waves = ["Pilot", "Wave 1", "Wave 2", "Wave 3", "Wave 4"];
    return '<section class="block"><h2>How to use it</h2><p class="lead">Run it live in the discovery workshop with all wave countries present. Click a cell to cycle its rating. A process is a <b>core</b> candidate when every country that needs it can use the standard; local variants and gaps go to the design authority.</p>' +
      '<div class="legend">' + C.catalogue.scale.filter(function (x) { return x.code; }).map(function (x) { return '<span><span class="cell legend-cell ' + x.code + '" aria-hidden="true">' + x.code + "</span>" + h(x.label) + ": " + h(x.text) + "</span>"; }).join("") + "</div></section>" +
      '<section class="block"><div class="block-head"><h2>Fit-gap by country</h2>' + (st.example ? '<span class="example-note">' + h(C.catalogue.example.label) + "</span>" : "") + "</div>" +
      '<div class="toolbar"><label class="sr" for="new-cc">Country code</label><input id="new-cc" maxlength="3" placeholder="ISO" aria-describedby="cc-help">' +
      '<label class="sr" for="new-wave">Wave</label><select id="new-wave">' + waves.map(function (w) { return "<option>" + w + "</option>"; }).join("") + "</select>" +
      '<button class="btn small" data-act="add-country">Add country</button><span id="cc-help" class="progress">Two-letter ISO code, e.g. DE</span>' +
      '<span style="flex:1"></span><button class="btn small" data-act="copy-cat">Copy as CSV</button><button class="btn small" data-act="example-cat">Load example</button><button class="btn small" data-act="clear-cat">Clear ratings</button></div>' +
      '<div class="summary"><div class="tile"><b>' + counts.core + '</b><span>core candidates</span></div><div class="tile"><b>' + counts.local + '</b><span>core with local variants</span></div><div class="tile"><b>' + counts.gap + '</b><span>processes with gaps</span></div><div class="tile"><b>' + counts.na + '</b><span>not rated or out of scope</span></div></div>' +
      '<div class="country-fit">' + fit + "</div>" +
      '<div class="table-wrap" style="margin-top:16px"><table class="cat"><thead><tr><th>Area</th><th>Process</th><th>Step</th>' +
      cs.map(function (c) { return '<th class="cc">' + h(c.code) + ' <button data-act="del-country" data-c="' + h(c.code) + '" aria-label="Remove ' + h(c.code) + '">✕</button><span class="wv">' + h(c.wave) + "</span></th>"; }).join("") +
      "<th>Result</th></tr></thead><tbody>" + rows + "</tbody></table></div></section>";
  }
  function saveCat(st) { st.example = false; store.set("catalogue", st); }

  /* ---------- anonymous page counts (GoatCounter, no cookies) ---------- */
  var gcQueue = [];
  function analyticsOn() { return !!C.goatcounter && location.hostname === (C.analyticsHost || ""); }
  function track(o) {
    if (!analyticsOn()) return;
    try {
      if (window.goatcounter && typeof window.goatcounter.count === "function") window.goatcounter.count(o);
      else gcQueue.push(o);
    } catch (e) { /* counting must never break the page */ }
  }
  function loadAnalytics() {
    if (!analyticsOn()) return;
    window.goatcounter = { no_onload: true };
    var s = document.createElement("script");
    s.async = true;
    s.src = "https://gc.zgo.at/count.js";
    s.setAttribute("data-goatcounter", "https://" + C.goatcounter + ".goatcounter.com/count");
    s.setAttribute("data-goatcounter-settings", '{"no_onload": true}');
    s.onload = function () { gcQueue.splice(0).forEach(function (o) { track(o); }); };
    document.head.appendChild(s);
  }

  /* ---------- footer, copy, toast ---------- */
  function footer() {
    return "<footer><p>" + h(C.checked) + ". Settings move between releases; confirm each one in your org before you rely on it.</p>" +
      "<p>Independent guide, not affiliated with or endorsed by Salesforce, Inc. or Veeva Systems Inc. Salesforce, Agentforce and Life Sciences Cloud are trademarks of Salesforce, Inc.; Veeva and Vault CRM are trademarks of Veeva Systems.</p>" +
      '<p class="byline">Maintained by <a href="https://www.linkedin.com/in/fandiyacine/" target="_blank" rel="noopener">Yacine Fandi</a>, Salesforce Certified Agentforce Life Sciences Consultant, Administrator, Platform App Builder and Agentforce Specialist. Text and decks are licensed under <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>: reuse and adapt them, with credit.</p>' +
      (analyticsOn() ? "<p>Visits are counted anonymously with GoatCounter: no cookies, no personal data.</p>" : "") + "</footer>";
  }
  function toast(m) { var t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = m; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2400); }
  function copy(text, what) {
    var fail = function () {
      var b = document.createElement("div"); b.className = "dialog-back"; b.id = "dlg";
      b.innerHTML = '<div class="dialog" role="dialog" aria-modal="true" aria-label="' + h(what) + '"><div class="block-head"><b>' + h(what) + '</b><button class="btn small" data-act="close">Close</button></div><p style="margin:0 0 8px;font-size:14px">The clipboard is blocked here. Select the text and copy it.</p><textarea readonly id="out"></textarea></div>';
      document.body.appendChild(b); var ta = b.querySelector("textarea"); ta.value = text; ta.focus(); ta.select();
    };
    try { navigator.clipboard.writeText(text).then(function () { toast(what + " copied."); }, fail); } catch (e) { fail(); }
  }

  /* ---------- router ---------- */
  function route() {
    var id = (location.hash || "#start").slice(1) || "start";
    var c = chapter(id);
    if (!c) id = "start";
    renderNav(id);
    $("#main").innerHTML = id === "start" ? renderStart() : renderChapter(c);
    document.title = (id === "start" ? "" : c.title + " · ") + "LSC Multi-Country Rollout Cookbook";
    track({ path: "/" + (id === "start" ? "" : id), title: document.title });
    $(".rail").classList.remove("open");
    window.scrollTo(0, 0);
  }

  document.addEventListener("click", function (e) {
    var ph = e.target.closest("[data-phase]");
    if (ph) {
      e.preventDefault();
      var go = function () { var el = document.getElementById("phase-" + ph.getAttribute("data-phase")); if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); };
      if ((location.hash || "#start") !== "#start") { location.hash = "#start"; setTimeout(go, 50); } else go();
      return;
    }
    var b = e.target.closest("[data-act]"); if (!b) return;
    var act = b.getAttribute("data-act");
    if (act === "menu") { $(".rail").classList.toggle("open"); b.setAttribute("aria-expanded", $(".rail").classList.contains("open")); }
    else if (act === "close") { var d = $("#dlg"); if (d) d.remove(); }
    else if (act === "dl") { downloadFile(b.getAttribute("data-file"), b); }
    else if (act === "copy-questions") {
      var c = chapter(b.getAttribute("data-ch"));
      var lines = ["# " + c.title + ": workshop questions", ""];
      c.sections.filter(function (s) { return s.type === "ask"; }).forEach(function (s) {
        s.items.forEach(function (q, i) { lines.push((i + 1) + ". " + q.q, "   Why: " + q.why, ""); });
      });
      copy(lines.join("\n"), "Questions");
    }
    else if (act === "rate") {
      var st = catState(), i = b.getAttribute("data-i"), cc = b.getAttribute("data-c");
      var order = ["", "S", "L", "G", "N"], cur = (st.ratings[i] || {})[cc] || "";
      st.ratings[i] = st.ratings[i] || {};
      st.ratings[i][cc] = order[(order.indexOf(cur) + 1) % order.length];
      saveCat(st); rerender("dec-focus", b);
    }
    else if (act === "add-country") {
      var code = ($("#new-cc").value || "").trim().toUpperCase();
      if (!/^[A-Z]{2,3}$/.test(code)) { toast("Use a two-letter ISO code, for example DE."); return; }
      var st2 = catState();
      if (st2.countries.some(function (x) { return x.code === code; })) { toast(code + " is already in the table."); return; }
      if (st2.example) st2 = { countries: [], ratings: {} };
      st2.countries.push({ code: code, wave: $("#new-wave").value });
      saveCat(st2); rerender();
    }
    else if (act === "del-country") {
      var st3 = catState(), dc = b.getAttribute("data-c");
      st3.countries = st3.countries.filter(function (x) { return x.code !== dc; });
      Object.keys(st3.ratings).forEach(function (k) { delete st3.ratings[k][dc]; });
      saveCat(st3); rerender();
    }
    else if (act === "clear-cat") { var st4 = catState(); st4.ratings = {}; saveCat(st4); rerender(); toast("Ratings cleared. Countries kept."); }
    else if (act === "example-cat") { store.set("catalogue", exampleState()); rerender(); }
    else if (act === "copy-cat") {
      var st5 = catState();
      var rows = [["Area", "Process", "Step"].concat(st5.countries.map(function (x) { return x.code + " (" + x.wave + ")"; })).concat(["Result"])];
      C.catalogue.processes.forEach(function (p, i) {
        rows.push(p.concat(st5.countries.map(function (x) { return (st5.ratings[i] || {})[x.code] || ""; })).concat([classify(st5.ratings[i] || {}, st5.countries).label]));
      });
      copy(rows.map(function (r) { return r.map(function (v) { v = String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(","); }).join("\n"), "Catalogue CSV");
    }
  });
  function rerender(_, btn) {
    var key = btn ? btn.getAttribute("data-i") + "|" + btn.getAttribute("data-c") : null;
    var y = window.scrollY;
    var c = chapter("catalogue");
    $("#main").innerHTML = renderChapter(c);
    window.scrollTo(0, y);
    if (key) { var parts = key.split("|"); var el = document.querySelector('[data-act="rate"][data-i="' + parts[0] + '"][data-c="' + parts[1] + '"]'); if (el) el.focus(); }
  }
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.matches('.done input[type="checkbox"]')) {
      var all = checks(), ch = t.getAttribute("data-ch");
      all[ch] = all[ch] || {}; all[ch][t.getAttribute("data-i")] = t.checked;
      store.set("checks", all);
      var p = progress(chapter(ch)); var el = document.getElementById("prog-" + ch); if (el) el.textContent = p.n + " of " + p.total + " done";
      renderNav(ch);
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && $("#dlg")) $("#dlg").remove();
    if (e.key === "Enter" && e.target.id === "new-cc") { e.preventDefault(); var b = document.querySelector('[data-act="add-country"]'); if (b) b.click(); }
  });
  window.addEventListener("hashchange", route);
  loadAnalytics();
  route();
  downloadsNs();
})();

</script>
</body>
</html>
